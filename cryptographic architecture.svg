@startuml
title SecureVision - Cryptography Flow (Exam Whiteboard Version)

start
:Input File + Password;
:Generate Salt/Nonce/Data Key;
:PBKDF2 -> KEK + MAC Key;
:AES-GCM Encrypt File -> Ciphertext;
:AES-GCM Wrap Data Key -> Wrapped Key;
:SHA-256 Hashes (file/cipher/wrapped key);
:HMAC-SHA256 on Package;
:Store Final SV02 Package;
:Decrypt Path:\nVerify HMAC + Hashes,\nUnwrap Key,\nAES-GCM Decrypt,\nVerify File Hash;
stop
@enduml

