<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SecureVision – Client-Side Encryption</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 850px;
            background: #020617;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
        }

        .section {
            border: 1px solid #1e293b;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        h2 {
            color: #a5f3fc;
            margin-bottom: 15px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
        }

        input {
            background: #020617;
            color: #e5e7eb;
            border: 1px solid #334155;
        }

        button {
            background: #38bdf8;
            color: #020617;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        video {
            margin-top: 15px;
            width: 100%;
            border-radius: 8px;
            background: black;
        }

        .note {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🔐 SecureVision</h1>

        <!-- CLIENT-SIDE ENCRYPTION UPLOAD -->
        <div class="section">
            <h2>Encrypt & Upload (Client-Side)</h2>

            <input type="file" id="videoFile" accept="video/*">
            <input type="password" id="encPassword" placeholder="Encryption passphrase">

            <button onclick="uploadEncrypted()">Encrypt & Upload</button>

            <p class="note">
                Encryption is performed entirely in the browser using AES-256-GCM.
                The server never receives the password or plaintext video.
            </p>
        </div>

        <!-- CLIENT-SIDE DECRYPTION PLAYBACK -->
        <div class="section">
            <h2>Secure Playback</h2>

            <input type="text" id="filename" placeholder="example.mp4.enc">
            <input type="password" id="decPassword" placeholder="Decryption passphrase">

            <button onclick="playEncrypted(filename.value)">Decrypt & Play</button>

            <video id="videoPlayer" controls></video>

            <p class="note">
                Video is decrypted only in memory and never stored on disk.
            </p>
        </div>
    </div>

    <!-- CLIENT-SIDE CRYPTO -->
    <script src="/static/crypto.js"></script>
    <script src="/static/client_player.js"></script>

</body>

</html>
